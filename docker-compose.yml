name: blueshores

networks:
  app-network:
    driver: bridge

services:
  app:
    build: .
    container_name: app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_vendor:/app/vendor
    ports:
      - '8000:8000'
      - '5173:5173'
    networks:
      - app-network
    env_file: .env
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - REDIS_HOST=redis
    command: >
      bash -c "php artisan serve --host=0.0.0.0 --port=8000 &
               npm run dev &
               wait"

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - '6400:6379' # changed to 6400 to avoid conflict with other ports
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: true
      MYSQL_DATABASE: ${DB_DATABASE:-coffee_machine}
      MYSQL_USER: ${DB_USERNAME:-bs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bs_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3310:3306' # changed to 3310 to avoid conflict with other ports
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  mysql_data:
  app_node_modules:
  app_vendor:
