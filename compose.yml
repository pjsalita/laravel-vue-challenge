name: blueshores

networks:
  app-network:
    driver: bridge

services:
  app:
    build: .
    container_name: app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_vendor:/app/vendor
    ports:
      - "${APP_PORT:-8000}:8000"
      - 5173:5173
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    command: >
      bash -c "php artisan serve --host=0.0.0.0 --port=8000 &
               npm run dev &
               wait"

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - '6400:6379' # changed to 6400 to avoid conflict with other ports
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  app_node_modules:
  app_vendor:
